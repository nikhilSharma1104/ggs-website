name: Deploy to GitHub Pages

on:
  push:
    branches:
      - haha

# the deploy step pushes the built site to the gh-pages branch
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Create env file
        run: |
          touch .env
          echo "REACT_APP_GOOGLE_CALENDAR_API_KEY=${{ secrets.REACT_APP_GOOGLE_CALENDAR_API_KEY }}" >> .env
          echo "REACT_APP_WHATSAPP_NUMBER=${{ secrets.REACT_APP_WHATSAPP_NUMBER }}" >> .env
          echo "REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}" >> .env
          echo "REACT_APP_CALENDAR_API_URL=${{ secrets.REACT_APP_CALENDAR_API_URL }}" >> .env
          echo "REACT_APP_CONTACT_API_URL=${{ secrets.REACT_APP_CONTACT_API_URL }}" >> .env
          echo "REACT_APP_MONGODB_URI=${{ secrets.REACT_APP_MONGODB_URI }}" >> .env
          echo "REACT_APP_GOOGLE_API_KEY=${{ secrets.REACT_APP_GOOGLE_API_KEY }}" >> .env
          echo "REACT_APP_GOOGLE_DRIVE_GALLERY_FOLDER_ID=${{ secrets.REACT_APP_GOOGLE_DRIVE_GALLERY_FOLDER_ID }}" >> .env
          echo "REACT_APP_PROSPECTUS_DRIVE_ID=${{ secrets.REACT_APP_PROSPECTUS_DRIVE_ID }}" >> .env

      - name: Build
        run: npm run build
        env:
          CI: false

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build
          token: ${{ secrets.GITHUB_TOKEN }}
